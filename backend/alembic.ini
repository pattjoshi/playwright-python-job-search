# Alembic settings for developers, e.g. to create a migration after changing database/tables.py:
#   cd backend && alembic revision --autogenerate -m "add applications table"
# The app itself doesn't need this file: it applies migrations automatically on start.

[alembic]
script_location = %(here)s/src/job_search/database/migrations
file_template = %%(rev)s_%%(slug)s
# The database to compare against (the app's own database in the project folder).
sqlalchemy.url = sqlite:///%(here)s/../data/history.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
