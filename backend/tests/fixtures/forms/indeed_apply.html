<!doctype html>
<html><head><meta charset="utf-8"><title>Apply · Indeed</title></head><body>
<main id="step"></main>
<script>
  const steps = [
    '<label for="n">Full name</label><input id="n" required><label for="e">Email</label><input id="e" type="email" required>' +
      '<button onclick="go()">Continue</button>',
    '<fieldset><legend>Are you legally authorized to work in India?</legend>' +
      '<label><input type="radio" name="auth" value="yes" required> Yes</label><label><input type="radio" name="auth" value="no"> No</label>' +
      '</fieldset><button onclick="go()">Review your application</button>',
    '<p>Please review</p><button onclick="done()">Submit your application</button>',
  ];
  let i = 0; const show = () => (document.getElementById("step").innerHTML = steps[i]); show();
  function go() { i += 1; show(); }
  function done() { document.getElementById("step").innerHTML = "<h1>Your application has been submitted!</h1>"; }
</script></body></html>
