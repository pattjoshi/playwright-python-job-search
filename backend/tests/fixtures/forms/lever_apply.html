<!doctype html>
<html><head><meta charset="utf-8"><title>Apply · SDET - Beta</title>
<style>.visually-hidden{position:absolute;opacity:0;width:1px;height:1px}</style></head>
<body>
  <form id="application-form" action="thanks.html" method="get">
    <ul>
      <li class="application-question"><div class="application-label">Resume/CV ✱</div><input type="file" name="resume" style="display:none"></li>
      <li class="application-question"><div class="application-label">Full name ✱</div><input type="text" name="name" required></li>
      <li class="application-question"><div class="application-label">Email ✱</div><input type="email" name="email" required></li>
      <li class="application-question"><div class="application-label">Current company</div><input type="text" name="org"></li>
    </ul>
    <fieldset><legend>Are you willing to relocate? *</legend>
      <label><input class="visually-hidden" type="radio" name="relocate" value="yes"> Yes</label>
      <label><input class="visually-hidden" type="radio" name="relocate" value="no"> No</label>
    </fieldset>
    <div class="application-question"><div class="application-label">How soon can you join us? *</div><input type="text" name="cards[notice]" required></div>
    <label><input type="checkbox" name="consent" required> I agree to the privacy policy *</label>
    <button type="submit" class="template-btn-submit">Submit application</button>
  </form>
</body></html>
