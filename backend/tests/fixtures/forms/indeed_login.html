<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in · Indeed</title></head><body>
<div id="box">
  <label for="e">Email address</label><input id="e" type="email" onkeydown="if (event.key === 'Enter') step2()">
</div>
<script>
  if (document.cookie.includes("indeed=1")) document.getElementById("box").remove();
  function step2() {
    document.getElementById("box").innerHTML = '<a href="#" onclick="pw(); return false;">Sign in with password</a>';
  }
  function pw() {
    document.getElementById("box").innerHTML = '<label for="p">Password</label><input id="p" type="password" onkeydown="if (event.key === \'Enter\') done()">';
  }
  function done() {
    if (document.getElementById("p").value !== "right-password") return;  // stays on the password box
    document.cookie = "indeed=1; path=/"; document.body.innerHTML = "<h1>Signed in</h1>";
  }
</script></body></html>
