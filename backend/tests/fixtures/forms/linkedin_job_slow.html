<!doctype html>
<html><head><meta charset="utf-8"><title>QA Engineer | Acme | LinkedIn</title></head><body>
<h1>QA Engineer</h1><div id="slot"></div><script>setTimeout(() => { document.getElementById("slot").innerHTML = `<button class="jobs-apply-button" aria-label="Easy Apply to QA Engineer at Acme" onclick="openModal()">Easy Apply</button>`; }, 1200);</script>
<script>
  let step = 0;
  const pages = [
    '<label for="ph">Mobile phone number</label><input id="ph" required><button onclick="go(1)">Next</button>',
    '<label for="y">How many years of work experience do you have with Python?</label><input id="y" required>' +
      '<p class="artdeco-inline-feedback--error" id="err" hidden>Enter a whole number</p><button onclick="go(2)">Review</button>',
    '<p>Review your application</p><button onclick="sent()">Submit application</button>',
  ];
  function openModal() {
    document.body.insertAdjacentHTML("beforeend", '<div role="dialog" class="jobs-easy-apply-modal" id="m">' +
      '<button aria-label="Dismiss" onclick="dismiss()">×</button><div id="page"></div></div>');
    show();
  }
  function show() { document.getElementById("page").innerHTML = pages[step]; }
  function go(n) {
    const y = document.getElementById("y");
    if (y && !/^\d+$/.test(y.value)) { document.getElementById("err").hidden = false; return; }
    window["v" + step] = (document.querySelector("#page input") || {}).value; step = n; show();
  }
  function sent() { document.getElementById("m").innerHTML = "<h2>Your application was sent to Acme</h2>"; }
  function dismiss() { document.getElementById("m").insertAdjacentHTML("beforeend", '<button onclick="discard()">Discard</button>'); }
  function discard() { document.getElementById("m").remove(); window.discarded = true; }
</script></body></html>
