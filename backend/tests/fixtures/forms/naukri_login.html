<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title></head><body>
<form id="login" onsubmit="event.preventDefault(); signIn();">
  <label for="usernameField">Email</label><input id="usernameField" type="email">
  <label for="passwordField">Password</label><input id="passwordField" type="password">
  <p id="err" role="alert" hidden>Invalid details</p><button type="submit">Sign in</button>
</form>
<script>
  if (document.cookie.includes("naukri=1")) document.getElementById("login").remove();
  function signIn() {
    if (document.getElementById("passwordField").value !== "right-password") { document.getElementById("err").hidden = false; return; }
    document.cookie = "naukri=1; path=/"; document.body.innerHTML = "<h1>Welcome back</h1>";
  }
</script></body></html>
