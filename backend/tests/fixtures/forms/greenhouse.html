<!doctype html>
<html><head><meta charset="utf-8"><title>QA Engineer at Acme</title></head>
<body>
  <header><input type="search" name="q" placeholder="Search jobs"><input type="email" name="newsletter" placeholder="Get job alerts"></header>
  <h1>QA Engineer</h1>
  <p>Thank you for your interest in Acme. We build test automation with Python and Playwright.</p>
  <form id="application-form" action="thanks.html" method="get">
    <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input id="first_name" name="first_name" required></div>
    <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input id="last_name" name="last_name" required></div>
    <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input id="email" name="email" type="email" required></div>
    <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
    <div class="field"><label for="resume">Resume/CV <span class="asterisk">*</span></label><input id="resume" name="resume" type="file" style="display:none" required></div>
    <div class="field"><label for="cover_letter">Cover Letter</label><input id="cover_letter" name="cover_letter" type="file" style="display:none"></div>
    <div class="field"><label for="q1">LinkedIn Profile</label><input id="q1" name="q1"></div>
    <div class="field"><label for="q2">Are you legally authorized to work in India? *</label>
      <select id="q2" name="q2" required><option value="">Select...</option><option value="1">Yes</option><option value="0">No</option></select></div>
    <div class="field"><label for="q3">Why do you want to join Acme?</label><textarea id="q3" name="q3"></textarea></div>
    <button type="submit">Submit application</button>
  </form>
</body></html>
