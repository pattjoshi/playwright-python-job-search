<!doctype html>
<html><head><meta charset="utf-8"><title>SDET - Acme - Naukri</title></head><body>
<h1>SDET</h1><button id="apply-button" onclick="start()">Apply</button>
<div class="chatbot_DrawerContentWrapper" id="drawer" hidden>
  <div id="msgs"></div><div id="input"></div><div class="sendMsg" role="button" onclick="save()">Save</div>
</div>
<script>
  const steps = [
    { q: "Are you willing to relocate to Bengaluru?", options: ["Yes", "No"] },
    { q: "What is your notice period?" },
  ];
  let i = -1; const given = [];
  function start() { document.getElementById("drawer").hidden = false; next(); }
  function next() {
    i += 1;
    if (i >= steps.length) { document.body.insertAdjacentHTML("beforeend", "<p id='ok'>You have successfully applied to SDET</p>"); window.given = given; return; }
    const s = steps[i];
    document.getElementById("msgs").insertAdjacentHTML("beforeend", `<div class="botMsg">${s.q}</div>`);
    document.getElementById("input").innerHTML = s.options
      ? s.options.map((o, n) => `<input type="radio" name="o" id="o${n}" value="${o}"><label for="o${n}">${o}</label>`).join("")
      : '<div contenteditable="true" class="textArea"></div>';
  }
  function save() {
    const radio = document.querySelector("#input input:checked"), text = document.querySelector("#input [contenteditable]");
    given.push(radio ? radio.value : text.innerText); next();
  }
</script></body></html>
